[project]
name = "imp-enum"
version = "0.1.0"
description = "Impacket enumeration wrapper — run all Get/enum scripts with provided credentials."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=13.0.0",
    "rich-argparse>=1.4.0",
]

[project.scripts]
imp-enum = "imp_enum:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["impe", "imp_enum.py", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["impe"]

[tool.hatch.build.targets.wheel.force-include]
"imp_enum.py" = "imp_enum.py"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
